<!DOCTYPE html>
<!-- Alpine Passage — Four Seasons: single-file Three.js r185 diorama -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alpine Passage — Four Seasons</title>
    <style>
        :root {
            --txt: #f5f9fb;
            --muted: rgba(236, 244, 249, .62);
            --glass-tint: rgba(14, 22, 30, .26);
            --season: #ffd66b;
            --spring: cubic-bezier(.34, 1.45, .55, 1);
            --ease: cubic-bezier(.16, 1, .3, 1);
        }
        body[data-active-season="spring"] { --season: #ffb8d2; }
        body[data-active-season="summer"] { --season: #ffd66b; }
        body[data-active-season="autumn"] { --season: #ff9d45; }
        body[data-active-season="winter"] { --season: #bfe4ff; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #05080c;
            color: var(--txt);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        button { font: inherit; color: inherit; }
        #scene { position: fixed; inset: 0; z-index: 1; }
        #scene canvas { display: block; touch-action: none; outline: none; }

        /* Cinematic vignette + faint film grain (kept from the reference) */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 8; pointer-events: none;
            background:
                radial-gradient(circle at 50% 44%, transparent 46%, rgba(1, 4, 7, .2) 80%, rgba(1, 3, 5, .55) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, .12), transparent 26%, transparent 72%, rgba(0, 0, 0, .2));
        }
        body::after {
            content: ''; position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: .045;
            background-image:
                repeating-linear-gradient(117deg, transparent 0 3px, rgba(255,255,255,.12) 4px, transparent 5px 9px),
                repeating-linear-gradient(31deg, transparent 0 7px, rgba(255,255,255,.08) 8px, transparent 9px 14px);
            background-size: 113px 97px, 91px 127px;
            mix-blend-mode: overlay;
        }

        .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
        .ic { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

        /* ───────── Liquid glass surface ─────────
           Layers: refract (backdrop blur + SVG displacement) → tint → specular shine → content */
        .glass {
            position: relative;
            isolation: isolate;
            border-radius: var(--r, 24px);
            box-shadow: 0 22px 48px -18px rgba(0, 0, 0, .55), 0 3px 12px rgba(0, 0, 0, .18);
            transition: transform .5s var(--ease), box-shadow .5s var(--ease);
        }
        .g-refract, .g-tint, .g-shine { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
        .g-refract {
            z-index: -3; overflow: hidden;
            backdrop-filter: blur(16px) saturate(190%) brightness(1.06);
            -webkit-backdrop-filter: blur(16px) saturate(190%) brightness(1.06);
            filter: url(#liquid-glass);
        }
        .g-tint {
            z-index: -2;
            background:
                linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 42%, rgba(8,14,20,.16)),
                var(--glass-tint);
            transition: filter .5s var(--ease);
        }
        .g-shine {
            z-index: -1;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.62),
                inset 0 -1px 0 rgba(255,255,255,.1),
                inset 1px 0 0 rgba(255,255,255,.16),
                inset -1px 0 0 rgba(255,255,255,.16),
                inset 0 0 22px rgba(255,255,255,.05);
        }
        .g-shine::before {
            content: ''; position: absolute; left: 7%; right: 7%; top: 1px; height: 46%;
            border-radius: 999px 999px 40% 40% / 100% 100% 30% 30%;
            background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0));
            opacity: .5;
        }
        .g-shine::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(120% 60% at 18% 0%, rgba(255,255,255,.14), transparent 55%);
        }

        /* ───────── Title chip ───────── */
        .brand {
            position: fixed; z-index: 20; pointer-events: none;
            top: max(18px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left));
            max-width: calc(100vw - 2 * max(18px, env(safe-area-inset-left)));
            --r: 22px;
        }
        .brand-text { min-width: 0; }
        .brand-inner { display: flex; align-items: center; gap: 12px; padding: 11px 18px 12px 12px; }
        .brand-mark {
            flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
            color: var(--season);
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.28), rgba(255,255,255,.04) 70%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 6px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.2);
            transition: color 1.2s var(--ease);
        }
        .brand-mark .ic { width: 20px; height: 20px; }
        .eyebrow {
            display: block; font-size: 9.5px; font-weight: 650; letter-spacing: 1.6px; text-transform: uppercase;
            color: rgba(236, 244, 249, .58);
        }
        .brand-title { display: block; font-size: 20px; line-height: 1.12; font-weight: 650; letter-spacing: -.2px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .season-line { display: grid; margin-top: 3px; font-size: 12px; line-height: 16px; font-weight: 550; color: var(--muted); }
        /* Both lines share one grid cell, so the chip always grows to fit the text. */
        .season-line .sl {
            grid-area: 1 / 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(5px);
            transition: opacity .8s var(--ease), transform .8s var(--ease);
        }
        .season-line .sl.is-on { opacity: 1; transform: none; }
        .season-line .sl b { color: var(--season); font-weight: 650; transition: color 1.2s var(--ease); }
        .hint {
            position: fixed; z-index: 20; pointer-events: none;
            top: calc(max(18px, env(safe-area-inset-top)) + 86px); left: calc(max(18px, env(safe-area-inset-left)) + 6px);
            font-size: 10.5px; color: rgba(236, 244, 249, .5); letter-spacing: .2px;
            text-shadow: 0 1px 8px rgba(0,0,0,.6);
        }
        .hint kbd {
            display: inline-block; min-width: 16px; padding: 1px 5px; margin: 0 1px; border-radius: 5px; text-align: center;
            font: 600 10px/1.4 inherit; color: rgba(255,255,255,.82);
            background: rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
        }

        /* ───────── Control dock ───────── */
        .dock {
            position: fixed; z-index: 30; left: 12px; right: 12px;
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex; justify-content: center; pointer-events: none;
        }
        .bar { --r: 30px; pointer-events: auto; max-width: 100%; }
        .bar:hover { transform: translateY(-2px); box-shadow: 0 28px 56px -18px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.2); }
        .bar:hover .g-tint { filter: brightness(1.18); }
        .bar-inner { display: flex; align-items: center; gap: 6px; padding: 6px; }
        .sep { width: 1px; height: 24px; margin: 0 3px; background: linear-gradient(180deg, transparent, rgba(255,255,255,.28), transparent); }

        .seg {
            --cell: 38px;
            position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cell));
            padding: 3px; border-radius: 999px;
            background: rgba(0, 0, 0, .16);
            box-shadow: inset 0 1px 3px rgba(0,0,0,.28), inset 0 -1px 0 rgba(255,255,255,.07);
        }
        .seg.times { --cell: 32px; }
        .lens {
            position: absolute; top: 3px; left: 3px; width: var(--cell); height: calc(100% - 6px);
            border-radius: 999px; pointer-events: none;
            transform: translateX(calc(var(--i, 0) * 100%));
            transition: transform .6s var(--spring);
            background:
                radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.45), rgba(255,255,255,.1) 58%, rgba(255,255,255,.04)),
                rgba(255,255,255,.06);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.78), inset 0 -2px 5px rgba(255,255,255,.12),
                inset 0 0 0 .5px rgba(255,255,255,.3), 0 5px 14px rgba(0,0,0,.28);
            backdrop-filter: saturate(170%) brightness(1.12);
            -webkit-backdrop-filter: saturate(170%) brightness(1.12);
        }
        .seg-btn, .icon-btn {
            appearance: none; border: 0; background: transparent; cursor: pointer;
            width: var(--cell, 32px); height: var(--cell, 32px); border-radius: 999px;
            display: grid; place-items: center; position: relative; z-index: 1;
            color: var(--muted);
            transition: color .35s var(--ease), transform .25s var(--ease), background-color .25s;
        }
        .seg-btn:hover, .icon-btn:hover { color: #fff; }
        .seg-btn:active, .icon-btn:active { transform: scale(.92); }
        .seg-btn .ic { transition: transform .5s var(--spring); }
        .seg-btn[aria-pressed="true"] { color: #fff; }
        .seasons .seg-btn[aria-pressed="true"] { color: var(--season); }
        .seg-btn[aria-pressed="true"] .ic { transform: scale(1.14); filter: drop-shadow(0 0 6px rgba(255,255,255,.35)); }
        .icon-btn { --cell: 32px; }
        .icon-btn[aria-pressed="true"] {
            color: #fff; background-color: rgba(255,255,255,.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 .5px rgba(255,255,255,.22);
        }
        .cams { display: flex; gap: 2px; }

        .fps {
            min-width: 30px; white-space: nowrap; padding: 0 4px; text-align: center;
            font: 600 9.5px/1 ui-monospace, "SF Mono", Menlo, monospace; color: rgba(236,244,249,.55);
            font-variant-numeric: tabular-nums;
        }
        .fps.low { color: #ffb38a; }
        .collapse-btn .ic { transition: transform .5s var(--spring); }
        .mini { display: none; align-items: center; gap: 8px; padding: 0 6px 0 10px; font-size: 12.5px; font-weight: 600; color: var(--season); }
        .bar.collapsed .bar-inner > :not(.mini):not(.collapse-btn) { display: none; }
        .bar.collapsed .mini { display: flex; }
        .bar.collapsed .collapse-btn .ic { transform: rotate(180deg); }
        .bar.collapsed .bar-inner { padding: 4px; }

        :focus { outline: none; }
        :focus-visible { outline: 2px solid rgba(255,255,255,.95); outline-offset: 2px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--season) 45%, transparent); }

        /* ───────── Music toggle (bottom right) ───────── */
        .sound-btn {
            --r: 999px;
            position: fixed; z-index: 31;
            right: max(18px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));
            width: 52px; height: 52px; padding: 0;
            appearance: none; border: 0; background: transparent; cursor: pointer;
            display: grid; place-items: center;
            color: var(--season);
            opacity: 0; transform: translateY(12px) scale(.6); pointer-events: none;
            transition: opacity .7s var(--ease), transform .6s var(--spring), bottom .45s var(--ease), color .6s var(--ease), box-shadow .5s var(--ease);
        }
        body.entered .sound-btn { opacity: 1; transform: none; pointer-events: auto; }
        body.entered .sound-btn:hover { transform: translateY(-2px) scale(1.07); box-shadow: 0 26px 52px -16px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.22); }
        body.entered .sound-btn:active { transform: scale(.93); }
        .sound-btn:hover .g-tint { filter: brightness(1.2); }
        .sound-btn .ic { width: 23px; height: 23px; grid-area: 1 / 1; stroke-width: 1.8; transition: opacity .3s var(--ease), transform .45s var(--spring); }
        .sound-btn .ic-on { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--season) 55%, transparent)); }
        .sound-btn[aria-pressed="false"] { color: rgba(236, 244, 249, .78); }
        .sound-btn[aria-pressed="true"] .ic-off,
        .sound-btn[aria-pressed="false"] .ic-on { opacity: 0; transform: scale(.55) rotate(-12deg); }
        .sound-btn .ring {
            position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            border: 1.5px solid var(--season); opacity: 0;
        }
        .sound-btn[aria-pressed="true"] .ring { animation: soundRing 2.6s ease-out infinite; }
        .sound-btn[aria-pressed="true"] .ring + .ring { animation-delay: 1.3s; }
        @keyframes soundRing { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }

        /* ───────── Intro gate — TechArtist logo + Enter ───────── */
        #loader {
            position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
            padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            overflow: hidden auto;
            background: #05080d;
            transition: opacity 1s var(--ease), visibility 0s linear 1s;
        }
        #loader::before {
            content: ''; position: fixed; inset: -25%; z-index: 0; pointer-events: none;
            background:
                radial-gradient(34% 30% at 34% 38%, rgba(255, 150, 190, .26), transparent 70%),
                radial-gradient(34% 32% at 66% 60%, rgba(110, 190, 255, .24), transparent 70%),
                radial-gradient(28% 28% at 60% 30%, rgba(255, 190, 90, .2), transparent 70%),
                radial-gradient(26% 26% at 38% 70%, rgba(255, 140, 60, .14), transparent 70%);
            animation: auroraDrift 16s ease-in-out infinite alternate;
        }
        #loader::after {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 12%, transparent 62%);
            mask-image: radial-gradient(circle at 50% 50%, #000 12%, transparent 62%);
            animation: gridDrift 24s linear infinite;
        }
        @keyframes auroraDrift { from { transform: rotate(0deg) scale(1); } to { transform: rotate(14deg) scale(1.12); } }
        @keyframes gridDrift { to { background-position: 44px 44px, 44px 44px; } }
        #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
        #loader.done .intro-card { transform: scale(1.05); filter: blur(8px); }

        .intro-card {
            --r: 32px; z-index: 1;
            width: min(400px, 100%);
            padding: 30px 28px 22px; text-align: center;
            animation: cardIn 1.1s var(--ease) both;
            transition: transform 1s var(--ease), filter 1s var(--ease);
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } }

        /* Logo mark: a hexagon (tech) drawing itself around a TA monogram (artist),
           orbited by the four seasons, with a scan line sweeping through. */
        .ta-logo { width: 116px; height: 116px; display: block; margin: 0 auto 16px; overflow: visible; animation: taFloat 6s ease-in-out 2.4s infinite; }
        @keyframes taFloat { 50% { transform: translateY(-4px); } }
        .ta-ring { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 1; stroke-dasharray: 2 5; animation: taFade 1.2s var(--ease) 1.4s both; }
        .ta-dots { animation: taFade 1s var(--ease) 1.6s both; }
        .ta-hex-fill { fill: rgba(255,255,255,.05); animation: taFade 1.2s var(--ease) 1s both; }
        .ta-hex {
            fill: none; stroke: url(#ta-grad); stroke-width: 2.6; stroke-linejoin: round;
            stroke-dasharray: 1; stroke-dashoffset: 0;
            animation: taDraw 1.7s var(--ease) .15s both, taGlow 3.4s ease-in-out 2.2s infinite;
        }
        .ta-mono {
            fill: none; stroke: #fff; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1; stroke-dashoffset: 0;
            animation: taDraw 1.3s var(--ease) .8s both;
        }
        .ta-node { transform-box: fill-box; transform-origin: center; animation: taPop .7s var(--spring) both; animation-delay: calc(1.55s + var(--i) * .1s); }
        .ta-scan { opacity: 0; animation: taScan 3.6s ease-in-out 2.4s infinite both; }
        @keyframes taDraw { from { stroke-dashoffset: 1; } }
        @keyframes taFade { from { opacity: 0; } }
        @keyframes taPop { from { transform: scale(0); opacity: 0; } }
        @keyframes taGlow {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 214, 107, .25)); }
            50% { filter: drop-shadow(0 0 9px rgba(255, 184, 210, .65)); }
        }
        @keyframes taScan {
            0% { transform: translateY(-30px); opacity: 0; }
            12% { opacity: 1; }
            60% { transform: translateY(118px); opacity: 0; }
            100% { transform: translateY(118px); opacity: 0; }
        }

        .ta-word { display: flex; justify-content: center; font-size: 25px; line-height: 1; letter-spacing: .24em; margin-right: -.24em; }
        .ta-word span { display: inline-block; animation: taLetter .9s var(--ease) both; animation-delay: calc(1.15s + var(--i) * .055s); }
        .ta-tech span { font-weight: 300; color: rgba(255,255,255,.9); }
        .ta-artist span {
            font-weight: 800;
            background: linear-gradient(90deg, #ffb8d2, #ffd66b, #ff9d45, #bfe4ff);
            background-size: 600% 100%;
            background-position: calc(var(--j) * 20%) 0;
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        @keyframes taLetter { from { opacity: 0; transform: translateY(12px) scale(.9); filter: blur(6px); } }
        .ta-tag {
            margin-top: 10px; font-size: 9.5px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase;
            color: rgba(236,244,249,.5); margin-right: -.34em;
            animation: taFade 1s var(--ease) 1.9s both;
        }
        .intro-rule {
            width: 56px; height: 1px; margin: 18px auto 16px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
            animation: ruleIn 1s var(--ease) 2s both;
        }
        @keyframes ruleIn { from { transform: scaleX(0); opacity: 0; } }
        .intro-scene { animation: taFade 1s var(--ease) 2.1s both; }
        .intro-presents { font-size: 9.5px; font-weight: 650; letter-spacing: 1.8px; text-transform: uppercase; color: rgba(236,244,249,.5); }
        .intro-title { margin-top: 4px; font-size: 21px; font-weight: 650; letter-spacing: -.2px; }
        .intro-sub { margin-top: 3px; font-size: 12px; color: var(--muted); }

        .intro-progress { position: relative; width: 170px; height: 3px; margin: 18px auto 0; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,.12); }
        .intro-progress::after {
            content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: sweep 1.2s ease-in-out infinite;
        }
        #loader.is-ready .intro-progress::after {
            width: 100%; animation: none;
            background: linear-gradient(90deg, #ffb8d2, #ffd66b, #ff9d45, #bfe4ff);
        }
        @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
        .intro-status { margin-top: 8px; min-height: 15px; font-size: 11px; color: rgba(236,244,249,.55); }

        .enter-btn {
            --r: 999px;
            appearance: none; border: 0; background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            min-width: 210px; height: 52px; margin: 16px auto 0; padding: 0 28px;
            font-size: 15px; font-weight: 650; letter-spacing: .3px; color: #fff;
        }
        .enter-btn .g-tint {
            background:
                linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.08) 55%, rgba(8,14,20,.12)),
                color-mix(in srgb, var(--season) 26%, rgba(14,22,30,.2));
        }
        .enter-btn .ic { width: 20px; height: 20px; }
        .enter-btn:disabled { cursor: progress; color: var(--muted); }
        .enter-btn:disabled .ic { opacity: .5; }
        #loader.is-ready .enter-btn { animation: enterPulse 2.8s ease-in-out .6s infinite; }
        #loader.is-ready .enter-btn:hover { transform: translateY(-2px) scale(1.03); }
        #loader.is-ready .enter-btn:hover .g-tint { filter: brightness(1.2); }
        #loader.is-ready .enter-btn:active { transform: scale(.97); }
        @keyframes enterPulse {
            0%, 100% { box-shadow: 0 22px 48px -18px rgba(0,0,0,.55), 0 0 0 0 color-mix(in srgb, var(--season) 45%, transparent); }
            60% { box-shadow: 0 22px 48px -18px rgba(0,0,0,.55), 0 0 0 14px color-mix(in srgb, var(--season) 0%, transparent); }
        }
        .silent-link {
            appearance: none; border: 0; background: none; cursor: pointer;
            margin-top: 12px; padding: 4px 6px;
            font-size: 12.5px; font-weight: 550; color: rgba(236,244,249,.72);
            text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255,255,255,.32);
            transition: color .3s var(--ease), text-decoration-color .3s var(--ease);
        }
        .silent-link:hover { color: #fff; text-decoration-color: var(--season); }
        .silent-link:disabled { cursor: progress; opacity: .4; }

        /* ───────── Responsive ───────── */
        @media (max-width: 760px) {
            .hint { display: none; }
            .brand-inner { padding: 9px 14px 10px 10px; gap: 10px; }
            .brand-title { font-size: 17px; }
            .brand-mark { width: 32px; height: 32px; }
            .brand-mark .ic { width: 17px; height: 17px; }
        }
        @media (max-width: 380px) {
            .brand-inner { padding: 8px 12px 9px 8px; gap: 8px; }
            .brand-title { font-size: 15.5px; }
            .season-line { font-size: 11px; }
            .ta-word { font-size: 21px; }
        }
        @media (max-width: 600px) {
            .bar { --r: 26px; }
            .bar-inner { flex-wrap: wrap; justify-content: center; row-gap: 4px; }
            .sep { display: none; }
            .seg { --cell: 34px; }
            .seg.times { --cell: 30px; }
            .icon-btn { --cell: 30px; }
            .eyebrow { display: none; }
            .sound-btn { width: 48px; height: 48px; }
        }
        @media (max-height: 560px) {
            .ta-logo { width: 76px; height: 76px; margin-bottom: 10px; }
            .ta-tag, .intro-rule { display: none; }
            .intro-scene { margin-top: 12px; }
            .intro-card { padding: 20px 24px 16px; }
        }
        @media (prefers-reduced-motion: reduce) {

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

        /* ════════════════════════════════════════════════════════════════════
           QUALITY KNOBS — lower these first if a machine struggles.
           ════════════════════════════════════════════════════════════════════ */
        const QUALITY = {
            GRASS_COUNT: 13000,
            SHADOW_MAP_SIZE: 2048,
            MAX_PIXEL_RATIO: 1.5,
            USE_BLOOM: true,          // UnrealBloomPass on emissive lights; auto-disabled if FPS sags
            MSAA_SAMPLES: 4,
            ADAPTIVE: false,          // opt-in: step down bloom → pixel ratio when FPS stays < 45
            PARTICLES: { petals: 360, pollen: 240, leaves: 300, snow: 1700, fireflies: 80 }
        };

        // Former slider / selector defaults, now fixed.
        const LIGHT_POWER = 1.8;      // was LUMEN_POW
        const WIND_SPEED = 1.8;       // was WIND_VEL
        const FOG_BASE_DENSITY = 0.017; // was AIR_PROFILE = "valley haze"

        const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const SEASON_DURATION = REDUCED_MOTION ? 0.7 : 2.5;
        const TIME_DURATION = REDUCED_MOTION ? 0.5 : 1.6;

        // Background score. raw.githubusercontent serves the file as audio/mpeg
        // (the github.com/…/blob/… page URL is an HTML page, not the audio).
        const MUSIC_SRC = 'https://raw.githubusercontent.com/iamtechartist/three-d/f7ee24b051741b836baf482041d31deeb682b681/four-seasons-2.mp3';
        const MUSIC_VOLUME = 0.6;

        /* ════════════════════════════════════════════════════════════════════
           WORLD LAYOUT (unchanged from the reference)
           ════════════════════════════════════════════════════════════════════ */
        const WORLD_SIZE = 15;
        const HALF_WORLD = WORLD_SIZE / 2;
        const BASE_HEIGHT = 0.1;
        const ROAD_WIDTH = 1.4;
        const ROAD_DIR_X = 0.707106;
        const ROAD_DIR_Z = 0.707106;
        const BRIDGE_X = -0.72, BRIDGE_Z = -0.72;
        const BRIDGE_ALONG = BRIDGE_X * ROAD_DIR_X + BRIDGE_Z * ROAD_DIR_Z;
        const PEAK_X = -4.5, PEAK_Z = 4.5;
        const HUT_X = 4.5, HUT_Z = -4.5;
        const WINDMILL_X = 2.0, WINDMILL_Z = -4.5;
        const CAMP_X = 5.75, CAMP_Z = -2.45;
        const CLIFF_BASE_Y = -3.2;

        const STREAM_POINTS = [
            [-4.92, 3.93], [-5.16, 3.58], [-5.52, 3.08], [-5.48, 2.63],
            [-5.08, 2.18], [-4.2, 1.25], [-3.15, 0.45], [-2.25, 0.35],
            [-1.5, 0.06], [-1.15, -0.29], [-0.72, -0.72], [-0.29, -1.15],
            [0.06, -1.5], [0.2, -2.2], [0.28, -3.15], [0.42, -4.35],
            [0.58, -5.7], [0.75, -7.15]
        ];
        const STREAM_LENGTH = (() => {
            const cumulative = [0];
            let total = 0;
            for (let i = 0; i < STREAM_POINTS.length - 1; i++) {
                const [ax, az] = STREAM_POINTS[i];
                const [bx, bz] = STREAM_POINTS[i + 1];
                total += Math.hypot(bx - ax, bz - az);
                cumulative.push(total);
            }
            return { cumulative, total };
        })();
        const BRIDGE_STREAM_INDEX = STREAM_POINTS.findIndex(([x, z]) => x === BRIDGE_X && z === BRIDGE_Z);
        const BRIDGE_STREAM_PROGRESS = STREAM_LENGTH.cumulative[BRIDGE_STREAM_INDEX] / STREAM_LENGTH.total;
        const BRIDGE_WATER_LEVEL = -0.095;
        const CASCADE_AT = 0.34;      // downstream fraction where the stream steps down (waterfall)

        /* ════════════════════════════════════════════════════════════════════
           MATH HELPERS (CPU side)
           ════════════════════════════════════════════════════════════════════ */
        const { clamp, lerp, smoothstep, degToRad } = THREE.MathUtils;

        // Deterministic PRNG so the diorama layout is identical on every load.
        const rand = (() => {
            let s = 0x2f6b1c ^ 20260926;
            return () => {
                s = (s + 0x6D2B79F5) | 0;
                let t = Math.imul(s ^ (s >>> 15), 1 | s);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        })();
        const randRange = (a, b) => a + (b - a) * rand();

        function hash(x, z) {
            const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
            return s - Math.floor(s);
        }

        function valueNoise(x, z) {
            const ix = Math.floor(x), iz = Math.floor(z);
            const fx = x - ix, fz = z - iz;
            const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
            const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
            return (1 - uz) * ((1 - ux) * a + ux * b) + uz * ((1 - ux) * c + ux * d);
        }

        function fbm(x, z, octaves = 4) {
            let v = 0, amp = 0.5, f = 1;
            for (let i = 0; i < octaves; i++) {
                v += valueNoise(x * f, z * f) * amp;
                f *= 2.03; amp *= 0.5;
            }
            return v;
        }

        // Ridged multifractal: sharp crests where noise crosses 0.5, weighted by the previous octave.
        function ridgedNoise(x, z) {
            let sum = 0, amp = 0.55, f = 1, prev = 1;
            for (let i = 0; i < 4; i++) {
                let n = 1 - Math.abs(valueNoise(x * f, z * f) * 2 - 1);
                n *= n;
                sum += n * amp * prev;
                prev = n;
                f *= 2.1; amp *= 0.5;
            }
            return sum;
        }

        function getLateralRoadDist(x, z) {
            return Math.abs(-x * ROAD_DIR_Z + z * ROAD_DIR_X);
        }

        function getStreamMetrics(x, z) {
            let closest = Infinity, progress = 0;
            for (let i = 0; i < STREAM_POINTS.length - 1; i++) {
                const [ax, az] = STREAM_POINTS[i];
                const [bx, bz] = STREAM_POINTS[i + 1];
                const abx = bx - ax, abz = bz - az;
                const lengthSq = abx * abx + abz * abz;
                const t = clamp(((x - ax) * abx + (z - az) * abz) / lengthSq, 0, 1);
                const distance = Math.hypot(x - (ax + abx * t), z - (az + abz * t));
                if (distance < closest) {
                    closest = distance;
                    progress = (STREAM_LENGTH.cumulative[i] + Math.sqrt(lengthSq) * t) / STREAM_LENGTH.total;
                }
            }
            return { distance: closest, progress };
        }
        const distanceToStream = (x, z) => getStreamMetrics(x, z).distance;

        // Water level after the bridge: gentle descent plus a small cascade step.
        function getDownstreamWaterHeight(progress) {
            const d = clamp((progress - BRIDGE_STREAM_PROGRESS) / (1 - BRIDGE_STREAM_PROGRESS), 0, 1);
            const eased = d * d * (3 - 2 * d);
            const cascade = smoothstep(d, CASCADE_AT - 0.012, CASCADE_AT + 0.022);
            return BRIDGE_WATER_LEVEL - d * 0.16 - eased * 0.1 - cascade * 0.2;
        }

        // Matterhorn-like massif: a pyramidal body with four arêtes, a sharp leaning horn and ridged crags.
        function mountainHeight(x, z) {
            const dx = x - PEAK_X, dz = z - PEAK_Z;
            const d = Math.hypot(dx, dz);
            if (d >= 7.2) return 0;
            const t = 1 - d / 7.2;
            const ang = Math.atan2(dz, dx);
            const faces = Math.pow(Math.abs(Math.cos(2 * (ang + 0.42))), 0.65);
            const body = Math.pow(t, 2.05) * 4.2;
            const horn = Math.pow(Math.max(0, 1 - Math.hypot(x - (PEAK_X + 0.2), z - (PEAK_Z - 0.15)) / 1.7), 1.35) * 1.85;
            const ridges = ridgedNoise(x * 0.85 + 11.3, z * 0.85 - 4.1);
            let h = (body + horn) * (0.8 + ridges * 0.4);
            h += faces * t * t * 0.9 * (0.55 + ridges * 0.6);
            h += (valueNoise(x * 4.3, z * 4.3) - 0.5) * 0.2 * t;
            return h;
        }

        function getTerrainHeight(x, z) {
            if (Math.abs(x) > HALF_WORLD + 1e-4 || Math.abs(z) > HALF_WORLD + 1e-4) return -3.5;
            let h = BASE_HEIGHT + mountainHeight(x, z);

            // Gentle rolling hills
            h += valueNoise(x * 0.8, z * 0.8) * 0.35 + valueNoise(x * 0.3, z * 0.3) * 0.5;

            // Shallow stream channel
            const stream = getStreamMetrics(x, z);
            const streamDist = stream.distance;
            if (streamDist < 0.62) h -= (1 - smoothstep(streamDist, 0.08, 0.62)) * 0.18;

            // Flat road carve along the x = z diagonal
            const latDist = getLateralRoadDist(x, z);
            const roadShoulder = ROAD_WIDTH / 2 + 0.6;
            if (latDist < roadShoulder) {
                const t = clamp((latDist - ROAD_WIDTH / 2) / (roadShoulder - ROAD_WIDTH / 2), 0, 1);
                const s = t * t * (3 - 2 * t);
                h = 0.05 * (1 - s) + h * s;
            }

            // Stream banks outside the bridge deck → real underpass depth
            if (streamDist < 0.62) {
                const channel = 1 - smoothstep(streamDist, 0.08, 0.62);
                const outsideDeck = smoothstep(latDist, ROAD_WIDTH / 2 - 0.04, 1.08);
                const nearBridge = 1 - smoothstep(latDist, 1.18, 1.62);
                h -= channel * outsideDeck * nearBridge * 0.42;
            }

            // Downstream bed follows the descending water surface (including the cascade)
            if (stream.progress >= BRIDGE_STREAM_PROGRESS && streamDist < 0.68) {
                const water = getDownstreamWaterHeight(stream.progress);
                const bed = lerp(h, water - 0.085, 1 - smoothstep(streamDist, 0.06, 0.68));
                h = Math.min(h, bed);
            }
            return h;
        }

        const nonIndexed = (g) => (g.index ? g.toNonIndexed() : g);

        // Shared scratch objects — nothing below allocates inside the frame loop.
        const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
        const _obj = new THREE.Object3D();
        const _color = new THREE.Color();

        /* ════════════════════════════════════════════════════════════════════
           SHARED SEASON UNIFORMS
           One object, referenced (not cloned) by every seasonal material, so a
           single SeasonController.update() drives terrain, grass, trees, water,
           props and particles at once.
           ════════════════════════════════════════════════════════════════════ */
        const U = {
            uTime: { value: 0 },
            uWindTime: { value: 0 },       // integrated wind clock (speed changes never jump)
            uFlowTime: { value: 0 },       // integrated stream clock (slows to ~0 when frozen)
            uWindDir: { value: new THREE.Vector2(0.82, 0.57).normalize() },
            uSeasonW: { value: new THREE.Vector4(0, 1, 0, 0) },   // spring, summer, autumn, winter weights
            uSeasonBlend: { value: 1 },    // 0→1 progress of the running season transition
            uNight: { value: 0 },
            uSnowLine: { value: 4.8 },
            uSnowCoverage: { value: 0 },
            uFrost: { value: 0 },
            uLush: { value: 0.5 },
            uDry: { value: 0 },
            uFreeze: { value: 0 },
            uFoam: { value: 1 },
            uGrassHeight: { value: 1 },
            uCanopy: { value: 1 },
            uFlowers: { value: 0.4 },
            uMeadowTint: { value: new THREE.Vector3(1, 1, 1) },
            uGrassBase: { value: new THREE.Color() },
            uGrassTip: { value: new THREE.Color() },
            uFogColor: { value: new THREE.Color() },   // replaced by scene.fog.color at init
            uHeightFog: { value: 0.3 },
            uSunDir: { value: new THREE.Vector3(0.5, 0.5, -0.5) },
            uSunColor: { value: new THREE.Color() },
            uSkyTop: { value: new THREE.Color() },
            uSkyMid: { value: new THREE.Color() },
            uSkyBottom: { value: new THREE.Color() },
            uParticleRates: { value: new THREE.Vector4() },  // petals, pollen, leaves, snow (0..1)
            uFireflyRate: { value: 0 },
            uEvening: { value: 0 }
        };

        const SHARED_DECL = /* glsl */`
            uniform float uTime; uniform float uWindTime; uniform float uFlowTime; uniform vec2 uWindDir;
            uniform vec4 uSeasonW; uniform float uNight; uniform float uEvening;
            uniform float uSnowLine; uniform float uSnowCoverage; uniform float uFrost; uniform float uLush; uniform float uDry;
            uniform float uFreeze; uniform float uFoam; uniform float uGrassHeight; uniform float uCanopy; uniform float uFlowers;
            uniform vec3 uMeadowTint; uniform vec3 uGrassBase; uniform vec3 uGrassTip;
            uniform vec3 uFogColor; uniform float uHeightFog; uniform vec3 uSunDir; uniform vec3 uSunColor;
        `;

        const GLSL_NOISE = /* glsl */`
            float sn_hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
            float sn_noise(vec2 p) {
                vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
                return mix(mix(sn_hash(i), sn_hash(i + vec2(1.0, 0.0)), f.x),
                           mix(sn_hash(i + vec2(0.0, 1.0)), sn_hash(i + vec2(1.0, 1.0)), f.x), f.y);
            }
            float sn_fbm(vec2 p) {
                float v = 0.0; float a = 0.5;
                for (int i = 0; i < 4; i++) { v += a * sn_noise(p); p = p * 2.03 + vec2(17.2, 9.1); a *= 0.5; }
                return v;
            }
        `;

        // World position of the current vertex (instancing aware), written after <project_vertex>.
        const WORLD_POS_CODE = /* glsl */`
            {
                vec4 snWp = vec4(transformed, 1.0);
                #ifdef USE_INSTANCING
                    snWp = instanceMatrix * snWp;
                #endif
                vWPos = (modelMatrix * snWp).xyz;
            }
        `;
        const WORLD_NORMAL_CODE = /* glsl */`
            {
                vec3 snN = objectNormal;
                #ifdef USE_INSTANCING
                    snN = mat3(instanceMatrix) * snN;
                #endif
                vWNrm = normalize(mat3(modelMatrix) * snN);
            }
        `;
        // Valley height fog: thick near the floor, thinning with altitude and fading in with distance.
        const HEIGHT_FOG_CODE = /* glsl */`
            {
                float hfDist = length(vWPos - cameraPosition);
                float hfHeight = exp(-max(vWPos.y + 0.15, 0.0) * 1.25);
                float hf = uHeightFog * hfHeight * (1.0 - exp(-hfDist * 0.06));
                gl_FragColor.rgb = mix(gl_FragColor.rgb, uFogColor * 1.08, clamp(hf, 0.0, 0.72));
            }
        `;
        // Snow settling on upward-facing surfaces (reads uSnowCoverage).
        const snowDustCode = (amount = '1.0') => /* glsl */`
            {
                float sdN = sn_noise(vWPos.xz * 3.1) * 0.6 + sn_noise(vWPos.xz * 9.0) * 0.4;
                float sd = uSnowCoverage * (${amount}) * smoothstep(0.38, 0.78, vWNrm.y + (sdN - 0.5) * 0.5);
                diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.88, 0.92, 0.97), sd);
            }
        `;

        /**
         * Injects seasonal GLSL into a built-in material through onBeforeCompile so that
         * lighting, shadows and fog keep working. Every patched material links the shared
         * uniforms object U by reference.
         */
        function patchMaterial(material, {
            key,
            uniforms = null,
            worldPos = false,
            worldNormal = false,
            heightFog = true,
            vertexPars = '',
            vertexBegin = '',
            fragmentPars = '',
            diffuse = '',
            fragmentColor = '',
            fragmentRoughness = '',
            fragmentEmissive = '',
            fragmentNormal = ''
        }) {
            const needWP = worldPos || heightFog || worldNormal;
            material.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, U);
                if (uniforms) Object.assign(shader.uniforms, uniforms);
                const varyings = (needWP ? 'varying vec3 vWPos;\n' : '') + (worldNormal ? 'varying vec3 vWNrm;\n' : '');
                let vs = SHARED_DECL + GLSL_NOISE + varyings + vertexPars + '\n' + shader.vertexShader;
                if (vertexBegin) vs = vs.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + vertexBegin);
                if (worldNormal) vs = vs.replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n' + WORLD_NORMAL_CODE);
                if (needWP) vs = vs.replace('#include <project_vertex>', '#include <project_vertex>\n' + WORLD_POS_CODE);
                shader.vertexShader = vs;

                let fs = SHARED_DECL + GLSL_NOISE + varyings + fragmentPars + '\n' + shader.fragmentShader;
                if (diffuse) fs = fs.replace('vec4 diffuseColor = vec4( diffuse, opacity );', diffuse);
                if (fragmentColor) fs = fs.replace('#include <color_fragment>', '#include <color_fragment>\n' + fragmentColor);
                if (fragmentRoughness) fs = fs.replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n' + fragmentRoughness);
                if (fragmentNormal) fs = fs.replace('#include <normal_fragment_begin>', '#include <normal_fragment_begin>\n' + fragmentNormal);
                if (fragmentEmissive) fs = fs.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + fragmentEmissive);
                if (heightFog) fs = fs.replace('#include <fog_fragment>', '#include <fog_fragment>\n' + HEIGHT_FOG_CODE);
                shader.fragmentShader = fs;
            };
            material.customProgramCacheKey = () => 'alpine-' + key;
            return material;
        }

        /** Depth material for shadow casting that repeats a material's vertex deformation. */
        function makeDepthMaterial(key, vertexPars, vertexBegin) {
            const mat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
            mat.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, U);
                shader.vertexShader = SHARED_DECL + GLSL_NOISE + vertexPars + '\n' +
                    shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + vertexBegin);
            };
            mat.customProgramCacheKey = () => 'alpine-depth-' + key;
            return mat;
        }

        /* ════════════════════════════════════════════════════════════════════
           SEASON & TIME-OF-DAY DATA — plain objects. '#rrggbb' strings become
           THREE.Color, arrays become vectors, numbers are blended linearly.
           ════════════════════════════════════════════════════════════════════ */
        const SEASONS = [
            {
                key: 'spring', name: 'Spring',
                grassBase: '#347d25', grassTip: '#b5ea68', grassHeight: 0.95,
                meadowTint: [1.02, 1.12, 0.86], lush: 1, dry: 0, frost: 0,
                snowLine: 3.55, snowCoverage: 0.0, freeze: 0.0, flow: 1.7, foam: 1.5,
                fogTint: [1.0, 1.03, 1.04], fogDensity: 0.014, heightFog: 0.3,
                skyTint: [0.98, 1.02, 1.05], cloudShade: 0.05,
                particles: [1.0, 0.2, 0.0, 0.0], fireflies: 0.25,
                birds: 7, flowers: 1.0, canopy: 1, sunElev: 0.0, smoke: 0.35, fire: 0
            },
            {
                key: 'summer', name: 'Summer',
                grassBase: '#32781f', grassTip: '#9ad64e', grassHeight: 1.1,
                meadowTint: [0.95, 1.03, 0.8], lush: 0.55, dry: 0.1, frost: 0,
                snowLine: 4.85, snowCoverage: 0.0, freeze: 0.0, flow: 1.0, foam: 1.0,
                fogTint: [1, 1, 1], fogDensity: 0.012, heightFog: 0.18,
                skyTint: [1, 1, 1], cloudShade: 0.0,
                particles: [0.0, 1.0, 0.0, 0.0], fireflies: 1.0,
                birds: 9, flowers: 0.4, canopy: 1, sunElev: 0.12, smoke: 0.15, fire: 1
            },
            {
                key: 'autumn', name: 'Autumn',
                grassBase: '#7a6a2a', grassTip: '#f5a43a', grassHeight: 0.9,
                meadowTint: [1.22, 1.0, 0.62], lush: 0, dry: 1, frost: 0.05,
                snowLine: 4.15, snowCoverage: 0.06, freeze: 0.04, flow: 0.85, foam: 0.8,
                fogTint: [1.07, 0.98, 0.9], fogDensity: 0.016, heightFog: 0.45,
                skyTint: [1.06, 0.97, 0.88], cloudShade: 0.18,
                particles: [0.0, 0.0, 1.0, 0.0], fireflies: 0.35,
                birds: 5, flowers: 0.0, canopy: 1, sunElev: -0.08, smoke: 0.75, fire: 1
            },
            {
                key: 'winter', name: 'Winter',
                grassBase: '#b9c4bd', grassTip: '#f1f6f5', grassHeight: 0.2,
                meadowTint: [0.86, 0.92, 1.0], lush: 0, dry: 0.25, frost: 1,
                snowLine: 0.16, snowCoverage: 1.0, freeze: 1.0, flow: 0.04, foam: 0.1,
                fogTint: [0.95, 1.0, 1.08], fogDensity: 0.018, heightFog: 0.35,
                skyTint: [0.9, 0.97, 1.08], cloudShade: 0.38,
                particles: [0.0, 0.0, 0.0, 1.0], fireflies: 0.0,
                birds: 0, flowers: 0.0, canopy: 0, sunElev: -0.16, smoke: 1.0, fire: 0
            }
        ];

        const TIMES = [
            {
                key: 'sunset', name: 'Golden sunset',
                lightDir: [0.62, 0.34, -0.7], sunColor: '#ffcf96', sunIntensity: 1.0,
                hemiSky: '#ffd6b8', hemiGround: '#3b2b2c', hemiIntensity: 0.6,
                skyTop: '#1d3a66', skyMid: '#e98a60', skyBottom: '#ffb65c',
                fog: '#5a5460', exposure: 1.05,
                windows: 3.0, lantern: 1.6, bridge: 0.6, stars: 0.06, night: 0, evening: 1,
                sunBody: 1, moonBody: 0, glow: '#ffb56b', glowScale: 5.2, carLights: 0.35
            },
            {
                key: 'noon', name: 'High noon',
                lightDir: [0.3, 0.92, -0.28], sunColor: '#fff5e8', sunIntensity: 1.3,
                hemiSky: '#cfe4ff', hemiGround: '#4d5a3c', hemiIntensity: 0.8,
                skyTop: '#2c7fd8', skyMid: '#78b8f3', skyBottom: '#d8edff',
                fog: '#9cc2dc', exposure: 0.98,
                windows: 0.15, lantern: 0, bridge: 0, stars: 0, night: 0, evening: 0,
                sunBody: 1, moonBody: 0, glow: '#fff4dd', glowScale: 4.0, carLights: 0
            },
            {
                key: 'night', name: 'Moonlit night',
                lightDir: [-0.5, 0.62, -0.6], sunColor: '#a9c2ff', sunIntensity: 0.55,
                hemiSky: '#4a6190', hemiGround: '#121426', hemiIntensity: 0.85,
                skyTop: '#02040c', skyMid: '#08142e', skyBottom: '#191339',
                fog: '#0e152a', exposure: 1.22,
                windows: 5.0, lantern: 3.2, bridge: 1.6, stars: 1, night: 1, evening: 1,
                sunBody: 0, moonBody: 1, glow: '#7fc4ff', glowScale: 3.6, carLights: 1
            }
        ];

        function prepareSet(list) {
            return list.map(src => {
                const out = {};
                for (const [k, v] of Object.entries(src)) {
                    if (typeof v === 'string' && v[0] === '#') out[k] = new THREE.Color(v);
                    else if (Array.isArray(v)) out[k] = v.length === 4 ? new THREE.Vector4(...v) : new THREE.Vector3(...v);
                    else out[k] = v;
                }
                return out;
            });
        }

        /** Weighted blend of prepared data objects into a persistent target (no allocations). */
        class Blender {
            constructor(list) {
                this.list = prepareSet(list);
                this.keys = Object.keys(this.list[0]).filter(k => typeof this.list[0][k] !== 'string');
                this.out = {};
                for (const k of this.keys) {
                    const v = this.list[0][k];
                    this.out[k] = typeof v === 'number' ? 0 : v.clone();
                }
            }
            blend(weights) {
                const { list, keys, out } = this;
                for (let n = 0; n < keys.length; n++) {
                    const k = keys[n];
                    const t = out[k];
                    if (typeof t === 'number') {
                        let s = 0;
                        for (let i = 0; i < list.length; i++) s += list[i][k] * weights[i];
                        out[k] = s;
                    } else if (t.isColor) {
                        t.setRGB(0, 0, 0);
                        for (let i = 0; i < list.length; i++) {
                            const c = list[i][k], w = weights[i];
                            t.r += c.r * w; t.g += c.g * w; t.b += c.b * w;
                        }
                    } else {
                        t.multiplyScalar(0);
                        for (let i = 0; i < list.length; i++) t.addScaledVector(list[i][k], weights[i]);
                    }
                }
                return out;
            }
        }

        const easeInOut = t => t * t * t * (t * (t * 6 - 15) + 10); // smootherstep

        /* ════════════════════════════════════════════════════════════════════
           SEASON CONTROLLER
           Two independent axes (season, time of day). Each keeps a weight vector
           that animates from its old one-hot to the new one; every visual
           parameter is then a weighted blend, pushed into the shared uniforms.
           ════════════════════════════════════════════════════════════════════ */
        class SeasonController {
            constructor(initialSeason = 1, initialTime = 0) {
                this.seasons = new Blender(SEASONS);
                this.times = new Blender(TIMES);
                this.seasonIndex = initialSeason;
                this.timeIndex = initialTime;
                this.sW = [0, 0, 0, 0]; this.sW[initialSeason] = 1;
                this.sFrom = [...this.sW]; this.sTo = [...this.sW];
                this.tW = [0, 0, 0]; this.tW[initialTime] = 1;
                this.tFrom = [...this.tW]; this.tTo = [...this.tW];
                this.sProgress = 1;
                this.tProgress = 1;
                this.listeners = [];
                this.season = this.seasons.blend(this.sW);
                this.time = this.times.blend(this.tW);
                this.lightDir = new THREE.Vector3();
                this.update(0);
            }
            on(fn) { this.listeners.push(fn); }
            emit(type) { for (const fn of this.listeners) fn(type, this); }

            get seasonKey() { return SEASONS[this.seasonIndex].key; }
            get seasonName() { return SEASONS[this.seasonIndex].name; }
            get timeName() { return TIMES[this.timeIndex].name; }

            // Manual selection only. A new pick mid-transition re-targets smoothly from the
            // current blend, so the active button always matches where the scene is heading.
            setSeason(index) {
                if (!Number.isInteger(index) || index < 0 || index >= SEASONS.length || index === this.seasonIndex) return;
                this.sFrom = [...this.sW];
                this.sTo = [0, 0, 0, 0]; this.sTo[index] = 1;
                this.seasonIndex = index;
                this.sProgress = 0;
                this.emit('season');
            }

            setTime(index) {
                if (!Number.isInteger(index) || index < 0 || index >= TIMES.length || index === this.timeIndex) return;
                this.tFrom = [...this.tW];
                this.tTo = [0, 0, 0]; this.tTo[index] = 1;
                this.timeIndex = index;
                this.tProgress = 0;
                this.emit('time');
            }

            update(dt) {
                if (this.sProgress < 1) {
                    this.sProgress = Math.min(1, this.sProgress + dt / SEASON_DURATION);
                    const e = easeInOut(this.sProgress);
                    for (let i = 0; i < 4; i++) this.sW[i] = lerp(this.sFrom[i], this.sTo[i], e);
                }
                if (this.tProgress < 1) {
                    this.tProgress = Math.min(1, this.tProgress + dt / TIME_DURATION);
                    const e = easeInOut(this.tProgress);
                    for (let i = 0; i < 3; i++) this.tW[i] = lerp(this.tFrom[i], this.tTo[i], e);
                }
                const S = this.season = this.seasons.blend(this.sW);
                const T = this.time = this.times.blend(this.tW);

                // Light direction: time-of-day direction, lowered/raised by the season's sun elevation.
                this.lightDir.copy(T.lightDir).normalize();
                this.lightDir.y = Math.max(0.12, this.lightDir.y + S.sunElev);
                this.lightDir.normalize();

                // Push into the shared uniforms.
                U.uSeasonW.value.set(this.sW[0], this.sW[1], this.sW[2], this.sW[3]);
                U.uSeasonBlend.value = this.sProgress;
                U.uNight.value = T.night;
                U.uEvening.value = T.evening;
                U.uSnowLine.value = S.snowLine;
                U.uSnowCoverage.value = S.snowCoverage;
                U.uFrost.value = S.frost;
                U.uLush.value = S.lush;
                U.uDry.value = S.dry;
                U.uFreeze.value = S.freeze;
                U.uFoam.value = S.foam;
                U.uGrassHeight.value = S.grassHeight;
                U.uCanopy.value = S.canopy;
                U.uFlowers.value = S.flowers;
                U.uMeadowTint.value.copy(S.meadowTint);
                U.uGrassBase.value.copy(S.grassBase);
                U.uGrassTip.value.copy(S.grassTip);
                U.uHeightFog.value = S.heightFog * (1 - T.night * 0.35);
                U.uSunDir.value.copy(this.lightDir);
                U.uSunColor.value.copy(T.sunColor);
                const p = S.particles;
                U.uParticleRates.value.set(p.x, p.y * (1 - T.night * 0.8), p.z, p.w * (1 + T.night * 0.6));
                U.uFireflyRate.value = S.fireflies * clamp(T.night + this.tW[0] * 0.35, 0, 1);

                // Sky gradient = time colors × season tint, desaturated by overcast.
                tintSky(U.uSkyTop.value, T.skyTop, S.skyTint, S.cloudShade);
                tintSky(U.uSkyMid.value, T.skyMid, S.skyTint, S.cloudShade);
                tintSky(U.uSkyBottom.value, T.skyBottom, S.skyTint, S.cloudShade);
            }
        }

        function tintSky(dst, src, tint, shade) {
            dst.setRGB(src.r * tint.x, src.g * tint.y, src.b * tint.z);
            const l = dst.r * 0.3 + dst.g * 0.59 + dst.b * 0.11;
            dst.r = lerp(dst.r, l, shade); dst.g = lerp(dst.g, l, shade); dst.b = lerp(dst.b, l, shade);
        }

        /* ════════════════════════════════════════════════════════════════════
           STATIC BATCHING — merges one-off prop parts per material so the chalet,
           windmill, bridge etc. cost a handful of draw calls instead of hundreds.
           ════════════════════════════════════════════════════════════════════ */
        class StaticBatch {
            constructor() { this.parts = new Map(); }
            add(geometry, material, px = 0, py = 0, pz = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
                _obj.position.set(px, py, pz);
                _obj.rotation.set(rx, ry, rz);
                _obj.scale.set(sx, sy, sz);
                _obj.updateMatrix();
                return this.addMatrix(geometry, material, _obj.matrix);
            }
            addMatrix(geometry, material, matrix) {
                let g = geometry.index ? geometry.toNonIndexed() : geometry.clone();
                for (const name of Object.keys(g.attributes)) {
                    if (name !== 'position' && name !== 'normal' && name !== 'uv') g.deleteAttribute(name);
                }
                if (!g.attributes.normal) g.computeVertexNormals();
                if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
                g.clearGroups();
                g.applyMatrix4(matrix);
                if (!this.parts.has(material)) this.parts.set(material, []);
                this.parts.get(material).push(g);
                return this;
            }
            box(material, w, h, d, px, py, pz, rx = 0, ry = 0, rz = 0) {
                return this.add(new THREE.BoxGeometry(w, h, d), material, px, py, pz, rx, ry, rz);
            }
            build(parent, { castShadow = true, receiveShadow = true } = {}) {
                for (const [material, geos] of this.parts) {
                    const mesh = new THREE.Mesh(mergeGeometries(geos, false), material);
                    mesh.castShadow = castShadow;
                    mesh.receiveShadow = receiveShadow;
                    parent.add(mesh);
                    geos.forEach(g => g.dispose());
                }
                this.parts.clear();
            }
        }

        const stdMat = (color, roughness = 0.9, extra = {}) =>
            new THREE.MeshStandardMaterial({ color, roughness, flatShading: true, ...extra });

        /* Snow slabs on props (hut roof, windmill cap, bridge rails, car roofs).
           Geometry sits on local y = 0; the vertex shader scales thickness by uSnowCoverage
           so snow visibly builds up and melts away. While thin, the slab is sunk slightly
           below its host surface and grows up out of it, so the two never share a plane
           (a near-zero-thickness slab on the roof top caused z-fighting during blends). */
        const SNOW_SLAB_MIN_COVERAGE = 0.08;   // below this the slabs are fully hidden
        const snowSlabMaterial = patchMaterial(
            new THREE.MeshStandardMaterial({ color: 0xf3f7fb, roughness: 0.82 }),
            {
                key: 'snow-slab',
                worldPos: true,
                vertexBegin: /* glsl */`
                    float slabS = smoothstep(0.02, 0.9, uSnowCoverage);
                    transformed.y = transformed.y * max(slabS, 0.001) - 0.03 * (1.0 - slabS);
                    transformed.xz *= mix(0.92, 1.0, slabS);
                `,
                fragmentColor: /* glsl */`
                    diffuseColor.rgb *= 0.93 + 0.07 * sn_noise(vWPos.xz * 18.0);
                `
            }
        );
        const snowSlab = (w, h, d) => new THREE.BoxGeometry(w, h, d).translate(0, h / 2, 0);

        /* ════════════════════════════════════════════════════════════════════
           SKY — gradient dome with sun glow + faint milky way, sun & moon bodies,
           twinkling stars, drifting clouds.
           Reads: uSkyTop/Mid/Bottom, uSunDir, uNight, uFogColor; season cloudShade.
           ════════════════════════════════════════════════════════════════════ */
        class Sky {
            constructor(scene) {
                this.glowColor = new THREE.Color();
                this.skyMaterial = new THREE.ShaderMaterial({
                    uniforms: { ...U, uGlowColor: { value: this.glowColor } },
                    side: THREE.BackSide,
                    depthWrite: false,
                    fog: false,
                    vertexShader: /* glsl */`
                        varying vec3 vDir;
                        void main() {
                            vDir = normalize((modelMatrix * vec4(position, 1.0)).xyz);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: SHARED_DECL + GLSL_NOISE + /* glsl */`
                        uniform vec3 uSkyTop; uniform vec3 uSkyMid; uniform vec3 uSkyBottom; uniform vec3 uGlowColor;
                        varying vec3 vDir;
                        void main() {
                            vec3 dir = normalize(vDir);
                            float t = clamp(dir.y * 1.5 + 0.5, 0.0, 1.0);
                            vec3 sky = mix(uSkyBottom, uSkyMid, smoothstep(0.0, 0.42, t));
                            sky = mix(sky, uSkyTop, smoothstep(0.42, 1.0, t));
                            float sd = max(dot(dir, normalize(uSunDir)), 0.0);
                            sky += uGlowColor * (pow(sd, 6.0) * 0.38 + pow(sd, 48.0) * 0.8);
                            sky = mix(sky, uFogColor, (1.0 - smoothstep(0.0, 0.18, abs(dir.y))) * 0.18);
                            float bd = dot(dir, normalize(vec3(0.35, 0.3, 0.88)));
                            float band = exp(-bd * bd * 14.0);
                            float mw = sn_fbm(dir.xz * 5.0 + dir.y * 3.0);
                            sky += vec3(0.22, 0.26, 0.42) * band * mw * uNight * 0.3;
                            gl_FragColor = vec4(sky, 1.0);
                            #include <tonemapping_fragment>
                            #include <colorspace_fragment>
                        }
                    `
                });
                this.dome = new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), this.skyMaterial);
                this.dome.renderOrder = -10;
                scene.add(this.dome);

                // Sun body (HDR colour so it blooms) and a textured moon.
                this.sun = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(0.55, 3),
                    new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 1.9, 1.5), toneMapped: false, transparent: true, fog: false })
                );
                this.moon = new THREE.Mesh(
                    new THREE.SphereGeometry(0.46, 32, 16),
                    new THREE.MeshBasicMaterial({ map: makeMoonTexture(), color: new THREE.Color(1.5, 1.6, 1.8), toneMapped: false, transparent: true, fog: false })
                );
                this.glow = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: makeRadialGlowTexture(), transparent: true, opacity: 0.7,
                    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
                }));
                scene.add(this.sun, this.moon, this.glow);

                this.stars = this.createStars();
                scene.add(this.stars);
                this.clouds = this.createClouds();
                this.clouds.forEach(c => scene.add(c));
                this.cloudColor = new THREE.Color();
            }

            createStars() {
                const count = 1200;
                const positions = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                const phases = new Float32Array(count);
                for (let i = 0; i < count; i++) {
                    const radius = 40 + rand() * 20;
                    const theta = rand() * Math.PI * 2;
                    const phi = Math.acos(lerp(0.06, 1, rand()));
                    positions[i * 3] = Math.sin(phi) * Math.cos(theta) * radius;
                    positions[i * 3 + 1] = Math.cos(phi) * radius;
                    positions[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * radius;
                    sizes[i] = 1.2 + Math.pow(rand(), 3) * 3.2;
                    phases[i] = rand() * 6.283;
                }
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                g.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
                g.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
                this.starUniforms = { uStars: { value: 0 }, uTime: U.uTime, uPixelRatio: { value: 1 } };
                const m = new THREE.ShaderMaterial({
                    uniforms: this.starUniforms,
                    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
                    vertexShader: /* glsl */`
                        attribute float aSize; attribute float aPhase;
                        uniform float uTime; uniform float uPixelRatio;
                        varying float vTwinkle;
                        void main() {
                            vTwinkle = 0.65 + 0.35 * sin(uTime * (1.3 + fract(aPhase) * 2.0) + aPhase * 9.0);
                            gl_PointSize = aSize * uPixelRatio;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: /* glsl */`
                        uniform float uStars; varying float vTwinkle;
                        void main() {
                            float d = length(gl_PointCoord - 0.5);
                            float a = smoothstep(0.5, 0.0, d);
                            gl_FragColor = vec4(vec3(0.85, 0.9, 1.0) * 1.6, a * a * uStars * vTwinkle);
                        }
                    `
                });
                const pts = new THREE.Points(g, m);
                pts.rotation.z = -0.14;
                pts.frustumCulled = false;
                return pts;
            }

            createClouds() {
                this.cloudMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff, roughness: 0.95, flatShading: true, transparent: true, opacity: 0.9
                });
                const data = [
                    { x: 3, y: 6.6, z: -3, s: 0.85 }, { x: 5, y: 7.2, z: -5, s: 0.95 },
                    { x: 4, y: 6.9, z: -2, s: 0.7 }, { x: 6, y: 7.0, z: -4, s: 0.8 }
                ];
                return data.map(d => {
                    const puffs = [];
                    const n = 5 + Math.floor(rand() * 3);
                    for (let j = 0; j < n; j++) {
                        const g = new THREE.DodecahedronGeometry(0.4 + rand() * 0.4, 1);
                        g.scale(1, 0.65, 1);
                        g.translate((j - n / 2) * 0.4 + (rand() - 0.5) * 0.15, (rand() - 0.5) * 0.12, (rand() - 0.5) * 0.25);
                        puffs.push(g);
                    }
                    const cloud = new THREE.Mesh(mergeGeometries(puffs), this.cloudMaterial);
                    cloud.castShadow = true;
                    cloud.scale.setScalar(d.s);
                    cloud.position.set(d.x, d.y, d.z);
                    cloud.userData = { angle: rand() * 6.283, radius: 1 + rand() * 2, speed: 0.03 + rand() * 0.03, baseY: d.y, cx: d.x, cz: d.z };
                    return cloud;
                });
            }

            update(dt, sc, pixelRatio) {
                const T = sc.time, S = sc.season;
                const dir = sc.lightDir;
                // Celestial bodies sit on the light direction, crossfading sun ↔ moon.
                this.sun.position.copy(dir).multiplyScalar(11.5);
                this.moon.position.copy(this.sun.position);
                this.glow.position.copy(this.sun.position);
                this.sun.material.opacity = T.sunBody;
                this.sun.visible = T.sunBody > 0.01;
                this.moon.material.opacity = T.moonBody;
                this.moon.visible = T.moonBody > 0.01;
                this.moon.lookAt(0, 0, 0);
                this.glowColor.copy(T.glow);
                this.glow.material.color.copy(T.glow);
                this.glow.material.opacity = 0.72 * (1 - S.cloudShade * 0.6);
                this.glow.scale.set(T.glowScale, T.glowScale, 1);

                this.starUniforms.uStars.value = T.stars * (1 - S.cloudShade * 0.7);
                this.starUniforms.uPixelRatio.value = pixelRatio;
                this.stars.visible = T.stars > 0.01;
                this.stars.rotation.y += dt * 0.008;

                // Clouds: white by day, greyer in winter/autumn, deep blue at night.
                this.cloudColor.setRGB(1, 1, 1).lerp(_color.setRGB(0.62, 0.66, 0.72), S.cloudShade * 1.4);
                this.cloudColor.lerp(_color.setRGB(0.1, 0.12, 0.22), T.night * 0.85);
                this.cloudColor.lerp(_color.setRGB(1.0, 0.78, 0.66), (1 - T.night) * sc.tW[0] * 0.35);
                this.cloudMaterial.color.copy(this.cloudColor);
                for (const c of this.clouds) {
                    const u = c.userData;
                    u.angle += u.speed * dt * (WIND_SPEED * 0.3 + 0.2);
                    c.position.set(
                        u.cx + Math.cos(u.angle) * u.radius,
                        u.baseY - S.cloudShade * 0.6 + Math.sin(u.angle * 2) * 0.15,
                        u.cz + Math.sin(u.angle) * u.radius
                    );
                }
            }
        }

        function makeRadialGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(128, 128, 4, 128, 128, 128);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.14, 'rgba(255,245,220,.7)');
            g.addColorStop(0.42, 'rgba(255,220,180,.18)');
            g.addColorStop(1, 'rgba(255,200,160,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function makeMoonTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d9dde6';
            ctx.fillRect(0, 0, 128, 128);
            for (let i = 0; i < 26; i++) {
                const r = 3 + rand() * 12;
                const x = rand() * 128, y = rand() * 128;
                const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
                g.addColorStop(0, 'rgba(120,126,140,.55)');
                g.addColorStop(1, 'rgba(120,126,140,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        /* ════════════════════════════════════════════════════════════════════
           TERRAIN — heightfield with baked strata, scree, AO; seasonal coloring
           and snow in the fragment shader.
           Reads: uSnowLine, uSnowCoverage, uFrost, uLush, uDry, uMeadowTint, uHeightFog.
           ════════════════════════════════════════════════════════════════════ */
        class Terrain {
            constructor(scene) {
                this.scene = scene;
                this.buildSurface();
                this.buildCliffs();
                this.buildBoulders();
            }

            buildSurface() {
                const SEG = 120;
                const step = WORLD_SIZE / SEG;
                const geo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, SEG, SEG);
                geo.rotateX(-Math.PI / 2);
                const pos = geo.attributes.position;
                const heights = new Float32Array(pos.count);
                for (let i = 0; i < pos.count; i++) {
                    heights[i] = getTerrainHeight(pos.getX(i), pos.getZ(i));
                    pos.setY(i, heights[i]);
                }
                const W = SEG + 1;
                const hAt = (ix, iz) => heights[clamp(iz, 0, SEG) * W + clamp(ix, 0, SEG)];

                const colors = new Float32Array(pos.count * 3);
                const mats = new Float32Array(pos.count * 3);
                const cMeadowA = new THREE.Color(0x3f6b2b), cMeadowB = new THREE.Color(0x679546);
                const cRockA = new THREE.Color(0x57534f), cRockB = new THREE.Color(0x8a8279), cRockHi = new THREE.Color(0x9c9a99);
                const cScreeA = new THREE.Color(0x6f685b), cScreeB = new THREE.Color(0x938b7d);
                const cDirt = new THREE.Color(0x59463c), cBank = new THREE.Color(0x5f5a4e);
                const col = new THREE.Color(), tmp = new THREE.Color();

                for (let iz = 0; iz <= SEG; iz++) {
                    for (let ix = 0; ix <= SEG; ix++) {
                        const i = iz * W + ix;
                        const x = pos.getX(i), z = pos.getZ(i), h = heights[i];
                        const gx = (hAt(ix + 1, iz) - hAt(ix - 1, iz)) / (2 * step);
                        const gz = (hAt(ix, iz + 1) - hAt(ix, iz - 1)) / (2 * step);
                        const slope = Math.hypot(gx, gz);
                        const lap = (hAt(ix + 1, iz) + hAt(ix - 1, iz) + hAt(ix, iz + 1) + hAt(ix, iz - 1)) / 4 - h;
                        const n = valueNoise(x * 0.6, z * 0.6), n2 = valueNoise(x * 2.3, z * 2.3);
                        const dPeak = Math.hypot(x - PEAK_X, z - PEAK_Z);
                        const lat = getLateralRoadDist(x, z);
                        const sd = distanceToStream(x, z);

                        const rock = Math.max(smoothstep(h, 1.3, 2.2), smoothstep(slope, 1.0, 1.7));
                        const scree = (1 - smoothstep(dPeak, 5.0, 6.6)) * (1 - rock) * smoothstep(h, 0.45, 0.95);
                        const dirt = lat < ROAD_WIDTH / 2 + 0.3 ? 1 : 0;
                        const bank = (1 - smoothstep(sd, 0.18, 0.36)) * (1 - rock);

                        // Meadow
                        col.lerpColors(cMeadowA, cMeadowB, clamp((h - BASE_HEIGHT) * 0.7 + n * 0.35, 0, 1));
                        // Rock with strata banding, lighter towards the summit
                        const band = 0.5 + 0.5 * Math.sin(h * 7.5 + n2 * 2.6 + x * 0.3);
                        tmp.lerpColors(cRockA, cRockB, band * 0.8 + n2 * 0.2);
                        tmp.lerp(cRockHi, smoothstep(h, 3.4, 6.0) * 0.7);
                        col.lerp(tmp, rock);
                        tmp.lerpColors(cScreeA, cScreeB, n2);
                        col.lerp(tmp, scree * 0.85);
                        col.lerp(cBank, bank * 0.7);
                        if (dirt) col.lerp(cDirt, 1 - rock);

                        // Baked ambient occlusion from local concavity
                        const ao = clamp(1 - Math.max(lap, 0) * 4.5, 0.5, 1) * (0.9 + 0.1 * clamp(1 - Math.max(-lap, 0) * 2, 0, 1) + 0.1 * smoothstep(-lap, 0, 0.05));
                        col.multiplyScalar(clamp(ao, 0.5, 1.05));

                        colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
                        const meadow = clamp(1 - rock - scree * 0.8 - dirt - bank * 0.6, 0, 1);
                        mats[i * 3] = meadow; mats[i * 3 + 1] = rock; mats[i * 3 + 2] = dirt;
                    }
                }
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geo.setAttribute('aMat', new THREE.BufferAttribute(mats, 3));
                geo.computeVertexNormals();

                const material = patchMaterial(
                    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0.02, flatShading: true }),
                    {
                        key: 'terrain',
                        worldPos: true,
                        vertexPars: 'attribute vec3 aMat; varying vec3 vMat;',
                        vertexBegin: 'vMat = aMat;',
                        fragmentPars: 'varying vec3 vMat;',
                        fragmentColor: /* glsl */`
                            vec3 wp = vWPos;
                            vec3 fN = normalize(cross(dFdx(wp), dFdy(wp)) + vec3(0.0, 1e-6, 0.0));
                            float up = abs(fN.y);
                            float n1 = sn_fbm(wp.xz * 0.9);
                            float n2 = sn_noise(wp.xz * 6.5);
                            float meadow = vMat.x;
                            vec3 col = diffuseColor.rgb;

                            // Spring: lush saturation. All seasons: meadow tint.
                            float lum = dot(col, vec3(0.299, 0.587, 0.114));
                            col = mix(col, mix(vec3(lum), col, 1.0 + 0.55 * uLush) * uMeadowTint, meadow);
                            // Autumn: dry golden patches.
                            float dryMask = uDry * meadow * smoothstep(0.42, 0.66, n1 + n2 * 0.15);
                            col = mix(col, vec3(0.4, 0.27, 0.09) * (0.8 + n2 * 0.4), dryMask * 0.75);
                            // Winter: frost on the meadow.
                            col = mix(col, vec3(0.6, 0.66, 0.7), uFrost * meadow * (0.35 + 0.25 * n2));

                            // Snow: height line + noise, only on flat enough faces (steep rock stays bare).
                            float snowEdge = wp.y + (n1 - 0.5) * 1.1 + (n2 - 0.5) * 0.25;
                            float snowBand = smoothstep(uSnowLine - 0.2, uSnowLine + 0.3, snowEdge);
                            float flatMask = smoothstep(0.5 - 0.12 * uSnowCoverage, 0.8, up);
                            float snSnow = snowBand * flatMask;
                            col = mix(col, vec3(0.86, 0.9, 0.96) * (0.94 + 0.06 * n2), snSnow);

                            // Road paint, snowy shoulders and wet asphalt in winter.
                            float snWet = 0.0;
                            float lat = abs(-wp.x * 0.707106 + wp.z * 0.707106);
                            float along = wp.x * 0.707106 + wp.z * 0.707106;
                            if (lat < 0.72 && wp.y < 0.2 && abs(wp.x) < 7.5 && abs(wp.z) < 7.5) {
                                vec3 asphalt = vec3(0.18, 0.19, 0.21) * mix(1.0, 0.5, uSnowCoverage);
                                float dash = step(0.5, fract(along * 0.75));
                                float isCenter = step(lat, 0.02) * dash;
                                float isEdge = step(abs(lat - 0.6), 0.025);
                                vec3 roadCol = mix(asphalt, vec3(0.9, 0.75, 0.1), isCenter);
                                roadCol = mix(roadCol, vec3(0.85), isEdge);
                                float edgeSnow = uSnowCoverage * smoothstep(0.5, 0.68, lat + (n2 - 0.5) * 0.14);
                                roadCol = mix(roadCol, vec3(0.84, 0.88, 0.93), edgeSnow);
                                float shoulder = smoothstep(0.7, 0.72, lat);
                                col = mix(roadCol, col, shoulder);
                                snWet = uSnowCoverage * (1.0 - edgeSnow) * (1.0 - shoulder);
                                snSnow *= shoulder;
                            }
                            diffuseColor.rgb = col;
                        `,
                        fragmentRoughness: /* glsl */`
                            roughnessFactor = mix(roughnessFactor, 0.26, snWet);
                            roughnessFactor = mix(roughnessFactor, 0.7, snSnow * 0.6);
                        `
                    }
                );
                this.mesh = new THREE.Mesh(geo, material);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.scene.add(this.mesh);
            }

            // Cliff walls with rock strata bands and a winter snow lip along the top edge.
            buildCliffs() {
                const SEG = 120, ROWS = 16;
                const corners = [[-HALF_WORLD, -HALF_WORLD], [HALF_WORLD, -HALF_WORLD], [HALF_WORLD, HALF_WORLD], [-HALF_WORLD, HALF_WORLD], [-HALF_WORLD, -HALF_WORLD]];
                const strata = [0x5b4a3f, 0x6e5d4e, 0x463830, 0x7d6c5a, 0x54473d].map(c => new THREE.Color(c));
